services:
  sun-panel:
    # 您的专属纯净版镜像（同时支持 x86_64 和 ARM64 处理器）
    image: ghcr.io/mysecret2022/my-sun-panel:latest
    container_name: sun-panel
    restart: always
    ports:
      - "3002:3002"
    volumes:
      # 持久化数据与附件挂载
      - ./conf:/app/conf
      - ./database:/app/database
      - ./uploads:/app/uploads
      - ./files:/app/files
